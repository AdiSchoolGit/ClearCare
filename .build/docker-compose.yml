services:
  nginx:
    build:
      context: ..
      dockerfile: .build/nginx/nginx.Dockerfile
    container_name: my-nginx-container
    ports:
      - "80:80"
    volumes:
      - ../.config/nginx.conf:/etc/nginx/nginx.conf

  flask1:
    build:
      context: ..
      dockerfile: .build/flask/flask.Dockerfile
    container_name: my-flask1-container
    #ports:
    #  - "5000:5000"
  flask2:
    build:
      context: ..
      dockerfile: .build/flask/flask.Dockerfile
    container_name: my-flask2-container
    #ports:
    #  - "5000:5000"
  flask3:
    build:
      context: ..
      dockerfile: .build/flask/flask.Dockerfile
    container_name: my-flask3-container
    #ports:
    #  - "5000:5000"

  mongo:
    image: mongo:8.2.5-noble
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    container_name: my-mongo-container
    ports:
      - "27017:27017"
    volumes:
      - ../data:/data

  nextjs:
    build:
      context: ..
      dockerfile: .build/nextjs/nextjs.Dockerfile
    container_name: my-nextjs-container
