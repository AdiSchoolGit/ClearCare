services:
  nginx:
    build:
      context: .
      dockerfile: ./nginx/nginx.Dockerfile
    container_name: my-nginx-container
    ports:
      - "80:80"
    volumes:
      - ../.config/nginx.conf:/etc/nginx/nginx.conf

  flask:
    build:
      context: ..
      dockerfile: ./.build/flask/flask.Dockerfile
    container_name: my-flask-container
    ports:
      - "5000:5000"
    volumes:
      - ../backend/server.py:/app/server.py
